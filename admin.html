<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resenha da Madrugada · Admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--n1:#0f1a3a;--n2:#16254f;--line:#2b3d7a;--acc:#ffc233;--acc2:#a87400;--ink:#0a0e1a;--mut:#8fa0cf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Rubik,system-ui,sans-serif;color:#eaf0ff;background:radial-gradient(800px 500px at 90% -10%,rgba(255,194,51,.2),transparent 60%),linear-gradient(#070b17,#0b1230) fixed}
main{max-width:980px;margin:0 auto;padding:32px 20px 60px}
h2{font-family:Bungee,Impact,sans-serif;font-weight:400;color:var(--acc);text-shadow:0 3px 0 var(--acc2);font-size:2rem;margin:0 0 18px}
.card{background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}
label{font:700 .72rem Rubik;letter-spacing:3px;text-transform:uppercase;color:var(--mut)}
input,button{font:500 1rem Rubik,sans-serif;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:#0a1230;color:inherit}
input:focus{outline:none;border-color:var(--acc)}
button{background:var(--acc);color:var(--ink);border:2px solid #7a5200;box-shadow:0 4px 0 var(--acc2);font-weight:700;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc2)}
button.sec{background:var(--n2);color:#eaf0ff;border-color:var(--line);box-shadow:0 4px 0 #0a1230}button.bad{background:#e04848;color:#fff;border-color:#8c1f1f;box-shadow:0 4px 0 #8c1f1f}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.r input[type=text]{flex:1;min-width:130px}.ic{width:64px!important;flex:0 0 64px!important;text-align:center}
.p{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--n1)}
.modal{position:fixed;inset:0;background:rgba(4,7,16,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.box{background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--acc);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center}
.box img{max-width:100%;max-height:240px;border-radius:12px;margin:12px 0;background:var(--n1)}
</style></head><body><main id="a"></main><script>
let pw='',D=null,M=null;const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw,...b})});return r.json()}
function login(){$('a').innerHTML=`<h2>Gerenciar localidades</h2><div class="card"><div class="r"><input id="pw" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')enter()"><button onclick="enter()">Entrar</button></div><p id="e" style="color:#ff7b7b;margin:6px 0 0"></p></div>`}
async function enter(){pw=$('pw').value;const r=await api('check',{});if(!r.ok){$('e').textContent='Senha incorreta';return}D=await (await fetch('/api/locations')).json();draw()}
const imgField=(i,v)=>`<input type="text" placeholder="Link da imagem (https://...)" value="${esc(v)}" onchange="askImg(${i},this)">`;
function askImg(i,el){const nv=el.value.trim(),old=(i<0?D.spyImage:D.locations[i].img)||'';if(nv===old)return;
  if(nv&&!/^https?:\/\/\S+$/.test(nv)){el.value=old;return alert('O link deve começar com http:// ou https://')}M={i,nv,old};draw()}
function okImg(){if(M.i<0)D.spyImage=M.nv;else D.locations[M.i].img=M.nv;M=null;draw()}
function noImg(){M=null;draw()}
function draw(){
  const who=M?(M.i<0?'do espião':'de "'+esc(D.locations[M.i].name)+'"'):'';
  $('a').innerHTML=`<h2>Gerenciar localidades</h2>
  <div class="card"><label>Imagem do espião</label><div class="r"><img class="p" src="${esc(D.spyImage)}" onerror="this.style.visibility='hidden'">${imgField(-1,D.spyImage)}</div></div>
  <div class="card"><label>Localidades (${D.locations.length})</label>${D.locations.map((l,i)=>`<div class="r"><img class="p" src="${esc(l.img)}" onerror="this.style.visibility='hidden'">
    <input class="ic" type="text" value="${esc(l.icon)}" oninput="D.locations[${i}].icon=this.value" title="Ícone (usado se não houver imagem)">
    <input type="text" value="${esc(l.name)}" oninput="D.locations[${i}].name=this.value">${imgField(i,l.img)}
    <button class="bad" onclick="D.locations.splice(${i},1);draw()">Excluir</button></div>`).join('')}
    <button class="sec" onclick="D.locations.push({name:'Nova localidade',icon:'',img:''});draw()">+ Adicionar localidade</button></div>
  <button onclick="save()" style="padding:14px 28px">Salvar alterações</button>
  ${M?`<div class="modal"><div class="box"><h3 style="margin:0;color:var(--acc)">${M.nv?'Usar esta imagem '+who+'?':'Remover a imagem '+who+'?'}</h3>
    ${M.nv?`<img src="${esc(M.nv)}" onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'Não foi possível carregar essa imagem. Confira o link.'}))">`:''}
    <div class="r" style="justify-content:center"><button class="sec" onclick="noImg()">Cancelar</button><button onclick="okImg()">Confirmar</button></div></div></div>`:''}`}
async function save(){const r=await api('save',{data:D});alert(r.ok?'Salvo!':'Erro ao salvar')}
login();
</script></body></html>

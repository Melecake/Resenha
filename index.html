<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resenha da Madrugada</title><meta name="theme-color" content="#070b17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1017'/%3E%3Ccircle cx='30' cy='34' r='18' fill='%23f5c542'/%3E%3Ccircle cx='41' cy='27' r='16' fill='%230d1017'/%3E%3Ccircle cx='48' cy='14' r='2.5' fill='%23f5c542'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b17;--n1:#0f1a3a;--n2:#16254f;--line:#2b3d7a;--acc:#ffc233;--acc2:#a87400;--ink:#0a0e1a;--txt:#eaf0ff;--mut:#8fa0cf;--disp:Bungee,Impact,"Arial Black",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 600px at 85% -10%,rgba(255,194,51,.22),transparent 60%),radial-gradient(800px 700px at 0% 110%,rgba(60,90,200,.35),transparent 60%),linear-gradient(#070b17,#0b1230)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 90px 120px,#fff6,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#ffd97a99,transparent),radial-gradient(1px 1px at 60px 180px,#fff5,transparent);background-size:200px 220px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.9}}
#lb{position:fixed;top:0;left:0;height:4px;width:100%;z-index:60;background:linear-gradient(90deg,transparent,var(--acc),transparent);transform:translateX(-100%);opacity:0}
body.loading #lb{opacity:1;animation:slide 1s linear infinite}@keyframes slide{to{transform:translateX(100%)}}
.bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px clamp(16px,4vw,56px);background:linear-gradient(#070b17ee,#070b1700);backdrop-filter:blur(6px)}
.bar .l{justify-self:start}.bar .r{justify-self:end}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:1rem;color:var(--acc);letter-spacing:1px;cursor:default;user-select:none}
.moon{width:26px;height:26px;border-radius:50%;background:var(--acc);box-shadow:inset -9px -2px 0 0 #0b1230,0 0 14px rgba(255,194,51,.6)}
.nbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px 10px 14px;background:var(--n2);color:var(--txt);border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 #0a1230;font:700 .78rem Rubik,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.15s}
.nbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}.nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1230}
.nbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.hide{visibility:hidden}
main{min-height:calc(100vh - 78px);display:flex;flex-direction:column;padding:8px clamp(16px,4vw,56px) 48px}
#app{margin:auto 0;width:100%}
#app.stack>*{max-width:820px;width:100%;margin-left:auto;margin-right:auto}#app.stack.wide>*{max-width:1280px}
#app.fw>*{max-width:1500px;width:100%;margin-left:auto;margin-right:auto}
#app>button{display:block}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(n+5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.splash{display:flex;flex-direction:column;align-items:center;gap:18px;padding:80px 0;color:var(--mut)}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--n2);border-top-color:var(--acc);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
button{font:700 1rem Rubik,sans-serif;letter-spacing:.5px;padding:13px 22px;border-radius:12px;border:2px solid #7a5200;background:var(--acc);color:var(--ink);box-shadow:0 5px 0 var(--acc2);cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s,filter .12s}
button:hover{filter:brightness(1.08);transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc2)}
button.sec{background:var(--n2);color:var(--txt);border-color:var(--line);box-shadow:0 5px 0 #0a1230}
button.bad{background:#e04848;color:#fff;border-color:#8c1f1f;box-shadow:0 4px 0 #8c1f1f;padding:8px 14px;font-size:.85rem}
button:disabled{opacity:.4;pointer-events:none}button.busy{pointer-events:none;color:transparent!important}
button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;border:3px solid rgba(128,128,128,.4);border-top-color:#fff;animation:rot .7s linear infinite}
input{font:500 1rem Rubik,sans-serif;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#0a1230;color:var(--txt);width:100%}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,194,51,.18)}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:1px;margin:.2em 0}
h1{text-align:center;font-size:clamp(1.8rem,4vw,3rem);color:var(--acc);text-shadow:0 4px 0 var(--acc2)}h2{font-size:clamp(1.3rem,2.4vw,2rem)}h3{font-size:1.1rem;color:var(--acc)}
label{display:block;font:700 .72rem Rubik;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}small{color:var(--mut)}
.card{position:relative;background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--line);border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;top:-2px;left:22px;width:70px;height:4px;background:var(--acc);border-radius:0 0 4px 4px}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1;min-width:0}.err{color:#ff7b7b;text-align:center;font-weight:500}.ctr{text-align:center}input.ctr{text-align:center}
.hero{text-align:center;padding:20px 0 6px}.eyebrow{font:700 .78rem Rubik;letter-spacing:6px;text-transform:uppercase;color:var(--mut)}
.hero.rel{position:relative;max-width:1280px;margin-left:auto;margin-right:auto;width:100%}.hero.rel .ibtn{position:absolute;top:6px;right:0}
.title{font-family:var(--disp);font-size:clamp(2.4rem,8vw,6.5rem);line-height:.95;color:var(--acc);text-shadow:0 5px 0 var(--acc2),0 0 40px rgba(255,194,51,.35);margin:10px 0 14px;transform:skew(-4deg)}
.sub{color:var(--mut);font-size:1.1rem}.mut{text-align:center;color:var(--mut)}
.ibtn{width:34px;height:34px;padding:0;border-radius:50%;background:var(--n2);color:var(--acc);border:2px solid var(--acc);box-shadow:0 3px 0 #0a1230;font:italic 700 1.15rem Georgia,serif;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{filter:none;transform:translateY(-2px);background:var(--acc);color:var(--ink)}.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1230}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(16px,2.5vw,32px);max-width:1280px;margin:34px auto 0}
.gc{position:relative;height:min(56vh,480px);min-height:340px;border-radius:24px;overflow:hidden;border:3px solid var(--line);cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-end;isolation:isolate}
.gc:hover{transform:translateY(-10px) rotate(-1deg);border-color:var(--acc);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 40px rgba(255,194,51,.25)}
.gc .art{position:absolute;inset:0;z-index:-2}.gc .art img{width:100%;height:100%;object-fit:cover}.gc .art img+i{display:none}
.gc .art i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:normal 400 clamp(3rem,9vw,6rem) Bungee,Impact,sans-serif;color:rgba(255,255,255,.14);transform:rotate(-8deg)}
.gc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 35%,rgba(7,11,23,.95))}
.gc .no{position:absolute;top:14px;left:18px;font-family:var(--disp);font-size:3.2rem;color:rgba(255,255,255,.2)}
.gc .ibtn{position:absolute;top:14px;right:14px;z-index:3}
.gc .info{padding:22px;width:100%;min-height:8.6rem;text-align:left}
.gc .info b{display:block;font-family:var(--disp);font-weight:400;font-size:1.45rem;line-height:1.2;min-height:2.4em;color:#fff;margin-bottom:6px}.gc .info span{display:block;color:var(--mut);font-size:.92rem}
.gc.off{filter:grayscale(.7) brightness(.7);cursor:default}.gc.off:hover{transform:none;border-color:var(--line);box-shadow:none}
.ribbon{position:absolute;top:22px;right:-38px;transform:rotate(35deg);background:var(--acc);color:var(--ink);font:700 .7rem Rubik;letter-spacing:2px;padding:5px 44px;text-transform:uppercase}
body.home{overflow:hidden;height:100vh}body.home .bar{display:none}
body.home main{height:100vh;min-height:0;padding:3vh clamp(16px,4vw,56px)}
body.home #app{margin:0;height:100%;display:flex;flex-direction:column}
body.home .hero{padding:0}body.home .title{font-size:clamp(2rem,min(7vw,11vh),5.5rem);margin:1vh 0}
body.home .games{flex:1;min-height:0;margin:3vh auto 0;width:100%}body.home .gc{height:auto;min-height:0}
@media(max-width:760px){body.home{overflow-y:auto;height:auto}body.home main,body.home #app{height:auto}body.home .gc{min-height:240px}}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,64px);align-items:center;max-width:1280px;margin:0 auto}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.art-side .title{font-size:clamp(2.2rem,6vw,5rem);transform-origin:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choices button{padding:16px 10px;font-size:1.05rem}
.codein{text-align:center;font-size:1.9rem;letter-spacing:10px;text-transform:uppercase;font-family:var(--disp)}
.code{font-family:var(--disp);font-size:clamp(3rem,9vw,6rem);color:var(--acc);text-align:center;letter-spacing:12px;text-shadow:0 5px 0 var(--acc2),0 0 40px rgba(255,194,51,.3)}
ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}li .nm{flex:1;display:flex;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#0a1230;border:2px solid var(--line);border-radius:14px;padding:6px 16px 6px 6px;font-weight:700;text-align:left}
.cn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.15;min-width:0}.cn b{word-break:break-word}.sb{display:flex;align-items:center;gap:6px}
.tag{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;background:var(--acc);color:var(--ink);padding:3px 7px;border-radius:6px;vertical-align:middle;font-weight:700}
.av{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.emos{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}@media(max-width:560px){.emos{grid-template-columns:repeat(5,1fr)}}
.eb,.cb{padding:0;box-shadow:none;background:var(--n1);border:2px solid var(--line)}.eb:hover,.cb:hover{transform:none;filter:brightness(1.2)}.eb:active,.cb:active{transform:none;box-shadow:none}
.eb{width:100%;aspect-ratio:1;font-size:1.4rem}.eb.sel,.cb.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,194,51,.35)}.eb:disabled{opacity:.2}
.cols{display:flex;flex-wrap:wrap;gap:10px}.cb{width:34px;height:34px;border-radius:50%}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;transition:.15s}
.tile:hover{transform:translateY(-3px) scale(1.03);border-color:var(--acc)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile img+i{display:none}
.tile i{font-size:1.7rem;font-style:normal}.tile span{position:relative;font-size:.74rem;font-weight:700;padding:3px 7px;margin-top:3px;border-radius:6px;background:rgba(0,0,0,.55)}
.tile.x{opacity:.3}.tile.x span{text-decoration:line-through}
.pick,.box.info{scrollbar-width:thin;scrollbar-color:var(--acc) #0a1230}
.pick::-webkit-scrollbar,.box.info::-webkit-scrollbar{width:10px}
.pick::-webkit-scrollbar-track,.box.info::-webkit-scrollbar-track{background:#0a1230;border-radius:8px}
.pick::-webkit-scrollbar-thumb,.box.info::-webkit-scrollbar-thumb{background:linear-gradient(var(--acc),var(--acc2));border-radius:8px;border:2px solid #0a1230}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:min(62vh,560px);overflow-y:auto;padding:4px 8px 4px 2px}.pick .tile{cursor:default}
.pick .tile i{font-size:1.3rem}.pick .tile span{font-size:.62rem;padding:2px 5px}
.tile.on{border-color:var(--acc)}.tile.off{opacity:.3;filter:grayscale(.6)}.pick .tile.on:hover,.pick .tile.off:hover{transform:none}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid6 .tile{aspect-ratio:5/4;border-radius:10px}.grid6 .tile i{font-size:1.2rem}.grid6 .tile span{font-size:.64rem;padding:2px 5px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px}.top h1{text-align:left;margin:0;font-size:1.6rem}
.me{display:flex;align-items:center;gap:12px}.me small{display:block}
.game{display:grid;grid-template-columns:320px 1fr;gap:28px;margin-top:16px}
.loc{position:relative;aspect-ratio:3/4;border-radius:20px;border:3px solid #ef4444;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.loc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.loc .ov{position:relative;padding:16px;text-shadow:0 1px 4px #000}.loc small{color:#ff8a8a;letter-spacing:3px;font-weight:700;text-transform:uppercase}
.loc h2{margin:8px 0 12px;font-size:1.9rem;color:#fff}.loc p{font-size:.88rem;opacity:.85;margin:0}
.rl li{padding:4px 0;font-size:.88rem}.rl .nm{gap:8px}.rl .av{width:26px;height:26px;flex-basis:26px;font-size:.95rem;border-radius:8px}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:14px}
.pc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--n1);box-shadow:0 4px 0 #0a1230;cursor:pointer;user-select:none;transition:.15s}
.pc:hover{transform:translateY(-2px)}.pc small{display:block;font-size:.75rem}
.pc.s1{background:rgba(214,69,69,.25);border-color:#e04848}.pc.s2{background:rgba(34,170,90,.25);border-color:#2dbd78}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.lt{padding:11px 0;text-align:center;border-radius:10px;background:var(--n1);border:2px solid var(--line);font:400 1rem Bungee,Impact,sans-serif;cursor:pointer;transition:.12s}
.lt:hover{border-color:var(--acc);color:var(--acc)}.lt.off{background:#3a1b1b;border-color:#6b2a2a;text-decoration:line-through;opacity:.5}
.big{font-family:var(--disp);font-size:clamp(5rem,16vw,9rem);color:var(--acc);text-align:center;line-height:1.1;text-shadow:0 5px 0 var(--acc2),0 0 50px rgba(255,194,51,.4)}
#spin{background:#0a1230;border:3px solid var(--acc);border-radius:24px;width:min(60vw,240px);margin:6px auto 0;padding:10px}
.worst{font-family:var(--disp);font-size:clamp(1.6rem,4vw,2.6rem);color:var(--acc);margin:10px 0;word-break:break-word}.worst span{font:500 .5em Rubik;color:var(--txt)}
.modal{position:fixed;inset:0;background:transparent;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;animation:fade .2s}
.modal .box{background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--acc);padding:26px;border-radius:20px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .25s both}
.box.info{max-width:660px;max-height:82vh;overflow-y:auto;text-align:left}
.box.info h4{font:400 1rem var(--disp);color:var(--acc);margin:18px 0 6px;letter-spacing:1px}
.box.info p,.box.info li{color:#cfd8f5;line-height:1.55;font-size:.95rem;margin:6px 0}
.box.info ul{list-style:disc;padding-left:22px;margin:6px 0}.box.info li{display:list-item;padding:2px 0}.box.info b{color:#fff}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:24px;margin-top:20px}
.vc{position:relative;display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:20px;border:2px solid var(--line);background:linear-gradient(180deg,var(--n2),var(--n1));box-shadow:0 8px 0 #0a1230}
.vh{display:flex;align-items:center;gap:14px}.vh b{font-size:1.15rem;word-break:break-word}
.vcnt{position:absolute;top:-14px;right:-8px;background:var(--acc);color:var(--ink);font:400 .95rem Bungee,Impact,sans-serif;padding:6px 14px;border-radius:12px;border:2px solid #7a5200;box-shadow:0 3px 0 var(--acc2);animation:pop .3s both}
.vt{font-size:1.3rem;font-weight:700;padding:12px 14px;background:#0a1230;border-radius:12px;word-break:break-word}
.mv{display:grid;grid-template-columns:repeat(var(--c,3),34px);justify-content:center;align-content:start;gap:6px;min-height:var(--h,130px);padding:8px;background:#0a1230;border:2px dashed var(--line);border-radius:14px}
.mv .av{width:34px;height:34px;flex:none;font-size:1.05rem;border-radius:9px}
.vb{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vb button{padding:13px 8px;font-size:.9rem;line-height:1.15}
@media(max-width:900px){.game{grid-template-columns:1fr}}@media(max-width:560px){.grid6{grid-template-columns:repeat(3,1fr)}.logo{font-size:.8rem}}
select{font:500 1rem Rubik,sans-serif;padding:14px 44px 14px 16px;border-radius:12px;border:2px solid var(--line);background-color:#0a1230;color:var(--txt);width:100%;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,194,51,.18)}
html{-webkit-text-size-adjust:100%}
button,.tile,.gc,.pc,.lt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.vsel{display:none}.vsel .vb{display:grid;margin-top:14px}
@media(max-width:900px){.loc{max-width:300px;margin-left:auto;margin-right:auto}}
@media(max-width:700px){.vsel{display:block}.vc .vb{display:none}.vgrid{gap:18px}.vc{padding:18px}}
@media(max-width:560px){
  .lgt{display:none}.bar{padding:10px 14px}.nbtn{padding:9px 14px 9px 10px;font-size:.7rem;letter-spacing:1px}
  main{padding-left:14px;padding-right:14px}.card{padding:18px;border-radius:16px}
  h1{font-size:1.7rem}.title{font-size:clamp(2rem,11vw,3.2rem)}
  .code{letter-spacing:8px}.codein{letter-spacing:6px;font-size:1.6rem}
  .choices{grid-template-columns:1fr}.modal{padding:14px}.modal .box{padding:20px}.box.info{max-height:86vh}
  .chip{padding-right:12px}.av{width:40px;height:40px;flex-basis:40px;font-size:1.3rem}
  .top{flex-direction:column;align-items:flex-start}.hero.rel .ibtn{top:0}.hero.rel h1{padding:0 40px}.worst{font-size:1.5rem}
}
</style></head><body><div id="lb"></div>
<header class="bar"><button class="nbtn l" id="bk" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Voltar</button>
<div class="logo" id="lg"><span class="moon"></span><span class="lgt">Resenha da Madrugada</span></div>
<button class="nbtn r" id="hm" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>Início</button></header>
<main><div id="app"></div></main><div id="ntc"></div><script>
// As capas dos jogos também podem ser alteradas pelo painel admin (/gerenciar-locais). "img" é o valor padrão.
const GAMES=[
  {id:'locais',name:'Impostor - Locais',short:'Locais',img:'',ok:true,tag:'Descubra o espião antes que ele descubra o local.'},
  {id:'pika',name:'O meu é mais Pika',short:'Pika',img:'',ok:true,tag:'Uma letra, um tema: quem disser a pior palavra perde.'},
  {id:'perguntas',name:'Impostor - Perguntas',short:'Perguntas',img:'',ok:true,tag:'Duas perguntas, um impostor.'}];
const INFO={
locais:{brief:'Todos recebem o mesmo local, menos o espião. Façam perguntas uns aos outros, descubram quem não sabe onde está e votem. O espião tenta descobrir o local sem ser pego.',
full:`<h4>Objetivo</h4><p>Todos os jogadores recebem o mesmo <b>local</b>, menos um: o <b>espião</b>, que não sabe onde está. Os jogadores tentam descobrir quem é o espião. O espião tenta descobrir o local e não ser pego.</p>
<h4>Antes de começar</h4><ul><li><b>Ícone e cor:</b> cada jogador escolhe um emoji e uma cor. Dois jogadores não podem ter o mesmo emoji, mas as cores podem se repetir.</li><li><b>Localidades:</b> o líder (quem criou a sala) marca quais localidades entram na partida, e todos veem a seleção.</li><li><b>Iniciar:</b> só o líder inicia a partida.</li></ul>
<h4>Durante a partida</h4><ul><li><b>Seu cartão:</b> mostra o local, ou "Espião" se você for o espião.</li><li><b>Conversa:</b> façam perguntas uns aos outros sobre o local, sem entregar demais.</li><li><b>Quadro de suspeitos:</b> só você vê. Clique em um jogador para alternar entre Na dúvida, Suspeito e Inocente. É só uma anotação sua. O espião não tem esse quadro.</li><li><b>Possíveis localidades:</b> toque em uma localidade para riscá-la e lembrar o que já descartou.</li></ul>
<h4>Votação</h4><ul><li><b>Pronto para votar:</b> quando achar que já deu, clique no botão. Se mudar de ideia, clique em Cancelar. A votação só abre quando todos estiverem prontos.</li><li><b>Declarar intenção:</b> seu emoji aparece no card da pessoa escolhida, para a turma ver em quem a maioria quer votar. Você pode mudar de alvo quantas vezes quiser.</li><li><b>Votar:</b> confirma o voto de forma definitiva. Quando todos votarem, o mais votado é revelado.</li></ul>
<h4>Quem vence</h4><ul><li>Se o espião for o único mais votado, <b>os jogadores vencem</b>.</li><li>Se outra pessoa for a mais votada, ou houver empate, <b>o espião vence</b>.</li></ul>
<h4>Outras regras</h4><ul><li>Se alguém sair, a partida continua.</li><li>Não é possível entrar em uma partida em andamento.</li><li>No fim, o líder pode clicar em <b>Jogar novamente</b> para sortear novo espião e novo local.</li></ul>`},
pika:{brief:'O líder escolhe um tema e uma letra é sorteada. Cada jogador diz uma palavra do tema que comece com a letra, e todos votam na pior resposta.',
full:`<h4>Objetivo</h4><p>Uma letra é sorteada e existe um tema. Cada jogador diz uma palavra do tema que comece com essa letra. No fim, a turma vota na <b>pior palavra</b>, e quem a escreveu perde.</p>
<h4>Sala de espera</h4><ul><li><b>Ícone e cor:</b> cada jogador escolhe um emoji (único na sala) e uma cor.</li><li><b>Tema:</b> o líder (quem criou a sala) digita o tema, e todos veem.</li><li><b>Letras:</b> o líder pode excluir letras do sorteio tocando nelas. Letras riscadas não entram.</li><li><b>Iniciar:</b> só o líder inicia a partida.</li></ul>
<h4>Rodada</h4><ul><li><b>Roleta:</b> uma animação sorteia a letra entre as que não foram excluídas.</li><li><b>Tema e letra:</b> aparecem na tela, seguidos de uma contagem de 3 segundos.</li><li><b>Eu tenho!:</b> quando você pensar em uma palavra, clique no botão. Você entra na fila pela ordem dos cliques, e a fila fica visível para todos.</li><li><b>Escrever:</b> só a pessoa que está na frente da fila escreve por vez, para ninguém repetir a mesma palavra. Quando ela envia, o nome e a palavra aparecem para todos, e o próximo da fila é liberado.</li></ul>
<h4>Votação</h4><ul><li>Começa quando todos enviaram suas palavras, sem limite de tempo.</li><li><b>Declarar intenção:</b> seu emoji aparece no card escolhido, para a turma ver em quem a maioria quer votar.</li><li><b>Votar:</b> abre uma confirmação, e o voto é definitivo. O contador de votos aparece no card assim que alguém recebe um voto.</li><li>Quando todos votarem, o mais votado é o perdedor. Em caso de empate, todos os empatados perdem.</li></ul>
<h4>Depois da rodada</h4><ul><li><b>Nova partida:</b> volta à sala de espera para trocar o tema e as letras.</li><li><b>Jogar novamente o mesmo tema:</b> sorteia uma nova letra e começa outra rodada. Os dois botões são do líder e pedem confirmação.</li></ul>`},
perguntas:{brief:'Um host escreve duas perguntas parecidas: uma para os inocentes e outra para o impostor. Todos respondem, as respostas são reveladas e vocês votam em quem recebeu a pergunta diferente.',
full:`<h4>Objetivo</h4><p>O <b>host</b> escreve duas perguntas parecidas: uma para os <b>inocentes</b> e outra para o <b>impostor</b>. Todos respondem sem saber que existem duas perguntas. Os jogadores tentam descobrir quem respondeu à pergunta diferente. O impostor tenta passar despercebido.</p>
<h4>Sala de espera</h4><ul><li><b>Áreas:</b> a sala tem duas áreas, <b>Host</b> e <b>Jogadores</b>. A área Host começa vazia e comporta só uma pessoa. Para trocar o host, quem está nela clica em "Sair do host" e outra pessoa clica em "Ser o host".</li><li><b>Iniciar:</b> só o líder (quem criou a sala) inicia, e apenas se houver alguém como host e ao menos um jogador.</li><li><b>Ícone e cor:</b> cada jogador escolhe um emoji (único na sala) e uma cor.</li></ul>
<h4>Rodada</h4><ul><li><b>Host escreve:</b> os jogadores veem "Esperando o Host escrever as perguntas". O host escreve a pergunta dos inocentes e a do impostor.</li><li><b>Sorteio:</b> uma pessoa aleatória, entre os jogadores, recebe a pergunta do impostor. Todos os outros recebem a pergunta dos inocentes.</li><li><b>Respostas:</b> cada jogador vê só a sua pergunta, escreve a resposta e clica em Enviar.</li><li><b>Host espectador:</b> o host não joga. Ele acompanha a partida, vê quem é o impostor e as duas perguntas, mas não pode votar.</li></ul>
<h4>Revelação</h4><ul><li>Quando todos enviarem, as respostas aparecem embaçadas e são reveladas <b>uma por vez</b>, em ordem aleatória, com os nomes.</li><li>Só depois da última resposta a <b>pergunta dos inocentes</b> é revelada. É nesse momento que o impostor descobre que era o impostor.</li></ul>
<h4>Votação</h4><ul><li>Os inocentes veem só a pergunta dos inocentes. O impostor e o host veem as duas, e para o impostor a pergunta dele fica destacada.</li><li><b>Declarar intenção:</b> seu emoji aparece no card escolhido, para a turma ver em quem a maioria quer votar.</li><li><b>Votar:</b> abre uma confirmação, e o voto é definitivo.</li></ul>
<h4>Resultado</h4><ul><li>Se o mais votado for o impostor, <b>os jogadores vencem</b>.</li><li>Se não, aparece o nome do impostor e que <b>ele ganhou a partida</b>. Empate também dá vitória ao impostor.</li><li>No fim, aparecem o resultado e as duas perguntas. O líder escolhe <b>Nova partida</b> (volta à sala de espera, para trocar o host) ou <b>Jogar novamente</b> (mesmo host, perguntas novas).</li></ul>`}};
const EMOTES=["😎","🤠","🥸","🤓","😈","👻","🤖","👽","🦊","🐸","🐙","🦄","🐼","🦁","🐵","🐲","🐶","🐱","🦉","🐧"];
const HUES=[0,24,45,75,130,165,190,215,245,275,305,335];
const store={get:(k,d)=>{try{return JSON.parse(sessionStorage.getItem(k))??d}catch{return d}},set:(k,v)=>sessionStorage.setItem(k,JSON.stringify(v))};
let COVERS={},S=null,err='',struck=new Set(),marks={},mode='menu',screen='home',game='locais',ready=false,lastKey='',lt;
fetch('/api/locations').then(r=>r.json()).then(d=>{COVERS=d.covers||{};render()});
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
const busy=on=>document.body.classList.toggle('loading',on);
const tx=o=>{ws.send(JSON.stringify(o));busy(true);clearTimeout(lt);lt=setTimeout(()=>busy(false),4000)};
ws.onopen=()=>{ready=true;render()};
ws.onmessage=e=>{busy(false);const m=JSON.parse(e.data);
  if(m.type==='error'){if(m.alert)notify(m.msg);else err=m.msg}
  else{if(typeof P!=='undefined'&&(!S||S.phase!==m.phase))P.confirm=null;
    if(S&&S.phase!=='play'&&m.phase==='play'){struck=new Set();marks={}}S=m;err=''}
  render()};
ws.onclose=()=>{err='Conexão perdida. Recarregue a página.';render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.classList.contains('nbtn')&&!b.classList.contains('ibtn')&&!b.closest('.emos,.cols')){b.classList.add('busy');setTimeout(()=>b.classList.remove('busy'),700)}});
window.addEventListener('error',e=>{if(e.message)notify('Erro na página: '+e.message)});
window.addEventListener('unhandledrejection',e=>notify('Erro: '+((e.reason&&e.reason.message)||e.reason)));
function trans(k){if(k===lastKey)return;lastKey=k;const a=$('app');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter');setTimeout(()=>a.classList.remove('enter'),900)}
function notify(m){$('ntc').innerHTML=`<div class="modal"><div class="box"><h3 style="margin:0 0 10px">Aviso</h3><p style="margin:0 0 18px">${esc(m)}</p><button onclick="closeNote()">Entendi</button></div></div>`}
const closeNote=()=>{$('ntc').innerHTML=''};
function showInfo(id,full){const g=GAMES.find(x=>x.id===id),t=INFO[id];
  $('ntc').innerHTML=`<div class="modal" onclick="if(event.target===this)closeNote()"><div class="box ${full?'info':''}" style="${full?'':'text-align:center'}"><h3 style="margin:0 0 6px">${g.name}</h3>${full?t.full:`<p style="color:#cfd8f5;line-height:1.55">${t.brief}</p>`}<div style="text-align:center"><button style="margin-top:18px" onclick="closeNote()">Entendi</button></div></div></div>`}
const infoBtn=id=>`<button class="ibtn" title="Como jogar" onclick="event.stopPropagation();showInfo('${id}',true)">i</button>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const pl=id=>S.players.find(p=>p.id===id)||{};
const nm=id=>esc(pl(id).name||'?');
const av=id=>{const p=pl(id);return `<span class="av" style="background:hsl(${HUES[p.color]??200} 55% 32%)">${EMOTES[p.emo]??'?'}</span>`};
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const bg=n=>{const h=hue(n);return `background:linear-gradient(135deg,hsl(${h} 45% 30%),hsl(${(h+50)%360} 50% 16%))`};
const pic=l=>l.img?`<img src="${esc(l.img)}" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
const tile=(l,cls='',click='')=>`<div class="tile ${cls}" style="${bg(l.name)}" ${click}>${pic(l)}<i>${esc(l.icon||'')}</i><span>${esc(l.name)}</span></div>`;
const start=()=>tx({type:'start'}),again=()=>tx({type:'again'}),setReady=v=>tx({type:'ready',ready:v});
const prof=(e,c)=>tx({type:'profile',emo:e,color:c});
const mark=id=>{marks[id]=((marks[id]||0)+1)%3;render()};
function togLoc(i){const n=S.all[i].name,s=new Set(S.selected);s.has(n)?s.delete(n):s.add(n);tx({type:'locs',selected:[...s]})}
const selAll=v=>tx({type:'locs',selected:v?S.all.map(l=>l.name):[]});
function leaveRoom(){if(S){tx({type:'leave'});S=null}err=''}
function pick(id){game=id;screen='game';mode='menu';err='';render()}
function goHome(){leaveRoom();screen='home';mode='menu';render()}
function back(){if(S){leaveRoom();mode='menu'}else if(mode==='join')mode='menu';else screen='home';err='';render()}
const tags=p=>(p.id===S.host||p.id===S.you)?`<span class="sb">${p.id===S.host?'<span class="tag">líder</span>':''}${p.id===S.you?'<small>(você)</small>':''}</span>`:'';
const players=()=>`<div class="chips">${S.players.map(p=>`<span class="chip">${av(p.id)}<span class="cn"><b>${esc(p.name)}</b>${tags(p)}</span></span>`).join('')}</div>`;
function profileCard(){const me=pl(S.you),taken=new Set(S.players.filter(p=>p.id!==S.you).map(p=>p.emo));
  return `<div class="card"><label>Seu ícone</label><div class="emos">${EMOTES.map((e,i)=>`<button class="eb ${me.emo===i?'sel':''}" ${taken.has(i)?'disabled':''} onclick="prof(${i},${me.color})">${e}</button>`).join('')}</div>
  <label style="margin-top:16px">Sua cor</label><div class="cols">${HUES.map((h,i)=>`<button class="cb ${me.color===i?'sel':''}" style="background:hsl(${h} 55% 40%)" onclick="prof(${me.emo},${i})"></button>`).join('')}</div></div>`}

let rDefer=0,rTimer;
function render(){
  const a=document.activeElement;
  if(a&&a.id==='vsel'&&rDefer<6){rDefer++;clearTimeout(rTimer);rTimer=setTimeout(render,500);return}
  rDefer=0;
  try{renderMain()}catch(e){console.error(e);notify('Erro ao montar a tela: '+e.message+' ['+String(e.stack||'').split('\n')[1]+']')}
}
function renderMain(){
  const G=GAMES.find(g=>g.id===game),A=$('app');
  const E=err?`<p class="err">${esc(err)}</p>`:'';let h='';
  document.body.classList.toggle('home',screen==='home');
  $('bk').classList.toggle('hide',screen==='home');$('hm').classList.toggle('hide',screen==='home');$('lg').style.visibility=screen==='home'?'hidden':'visible';
  A.classList.toggle('stack',!!(S&&S.game));A.classList.toggle('fw',!!(S&&!S.game&&S.phase!=='lobby'));
  if(!ready){A.innerHTML='<div class="splash"><div class="spin"></div><p>Conectando ao servidor…</p></div>';return}
  if(screen==='home'){
    h=`<div class="hero"><div class="eyebrow">Bem-vindo à</div><div class="title">Resenha<br>da Madrugada</div><p class="sub">Escolha um jogo e marcha!</p></div>${E}
    <div class="games">${GAMES.map((g,i)=>{const im=COVERS[g.id]||g.img;return `<div class="gc ${g.ok?'':'off'}" ${g.ok?`onclick="pick('${g.id}')"`:''}><div class="art" style="${bg(g.name)}">${im?`<img src="${esc(im)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<i>${g.short}</i></div><span class="no">0${i+1}</span><button class="ibtn" title="Sobre o jogo" onclick="event.stopPropagation();showInfo('${g.id}',false)">i</button>${g.ok?'':'<span class="ribbon">Em breve</span>'}<div class="info"><b>${g.name}</b><span>${g.tag}</span></div></div>`}).join('')}</div>`;
    A.innerHTML=h;trans('home');return;
  }
  if(S&&S.game==='pika'){pikaRender('');return}
  if(S&&S.game==='perguntas'){perguntasRender();return}
  if(!S){
    h=`<div class="split"><div class="art-side"><div class="eyebrow">Resenha da Madrugada</div><div class="title">${G.name}</div><p class="sub">${G.tag}</p></div>`;
    if(mode==='menu')h+=`<div class="card ctr"><label>Seu nome</label><input id="name" class="ctr" maxlength="30" placeholder="Como você quer ser chamado?" value="${esc(store.get('name',''))}" onkeydown="if(event.key==='Enter')menu('create')">${E}
      <div class="choices"><button onclick="menu('create')">Criar sala</button><button class="sec" onclick="menu('join')">Entrar em sala</button></div></div></div>`;
    else h+=`<div class="card ctr"><label>Código da sala</label><input id="code" class="codein" maxlength="4" placeholder="ABCD" onkeydown="if(event.key==='Enter')join()">${E}
      <div class="row"><button onclick="join()">Entrar</button></div></div></div>`;
  }else if(S.phase==='lobby'){
    const host=S.you===S.host,sel=new Set(S.selected);
    h=`${E}<div class="hero rel" style="padding:0 0 10px"><div class="eyebrow">Sala de espera</div><h1>${G.name}</h1>${infoBtn(game)}</div>
    <div class="split" style="align-items:start"><div><div class="card ctr"><label>Código da sala</label><div class="code">${S.code}</div><p class="mut">Compartilhe o código com os amigos</p>${players()}</div>${profileCard()}
    ${host?'<button style="width:100%;padding:18px;font-size:1.1rem" onclick="start()">Iniciar partida</button>':'<div class="card ctr"><div class="spin" style="margin:0 auto 14px"></div><p class="mut" style="margin:0">Aguardando o líder iniciar…</p></div>'}</div>
    <div><div class="card"><label>Localidades da partida (${sel.size} de ${S.all.length})</label>
    ${host?`<div class="row"><button class="sec" onclick="selAll(true)">Marcar todas</button><button class="sec" onclick="selAll(false)">Desmarcar todas</button></div>`:'<p style="color:var(--mut);font-size:.85rem;margin:0 0 12px">Só o líder escolhe as localidades.</p>'}
    <div class="pick">${S.all.map((l,i)=>tile(l,sel.has(l.name)?'on':'off',host?`onclick="togLoc(${i})" style="cursor:pointer"`:'')).join('')}</div></div></div></div>`;
  }else{
    const R=S.role,me=pl(S.you),host=S.you===S.host;
    h=`<div class="top"><h1>Partida em andamento</h1><div class="me">${av(S.you)}<div><b>${esc(me.name)}</b><small>Sala ${S.code}</small></div></div></div>${E}`;
    if(S.phase==='vote'||S.phase==='end'){
      if(S.phase==='end'){const r=S.result;
        h+=`<div class="card ctr"><h2 style="color:var(--acc)">${r.caught?'Os jogadores venceram!':'O espião venceu!'}</h2><p>Mais votado: <b>${r.top.map(esc).join(' e ')}</b> (${r.max} voto${r.max>1?'s':''}). O espião era <b>${esc(r.spy)}</b>.</p><p>Local: <b>${esc(r.loc.name)}</b></p>
        ${host?'<button onclick="again()">Jogar novamente</button>':'<p class="mut">Aguardando o líder…</p>'}</div>`;
      }else h+=`<div class="card ctr"><label>Votação</label><h2>Quem é o espião?</h2><p class="mut" style="margin:0">Declare sua intenção para a turma ver e depois vote.${S.voted.includes(S.you)?' Você já votou.':''}</p></div>`;
      h+=board(S,S.players.map(p=>({id:p.id,name:p.name})),S.phase==='end')+modalHtml();
    }else{
      const L=R.loc,rdy=S.ready,mine=rdy.includes(S.you);
      const card=R.spy?`<div class="loc" style="background:linear-gradient(135deg,#4a1616,#12151c)">${pic({img:R.spyImg})}<div class="ov"><small>Sua função</small><h2>Espião</h2><p>Descubra o local sem ser pego.</p></div></div>`
        :`<div class="loc" style="${bg(L.name)}">${pic(L)}<div class="ov"><small>Local</small><h2>${esc(L.name)}</h2><p>Lembre-se: não revele o local! Pergunte e responda com cuidado.</p></div></div>`;
      h+=`<div class="game"><div><h3>Seu cartão</h3>${card}
        <div class="card"><label>Prontos para votar</label><b style="font-family:var(--disp);font-size:1.5rem;color:var(--acc)">${rdy.length}/${S.players.length}</b>
        <button style="width:100%;margin:12px 0 10px" class="${mine?'sec':''}" onclick="setReady(${!mine})">${mine?'Cancelar':'Pronto para votar'}</button>
        <ul class="rl">${S.players.map(p=>`<li><span class="nm">${av(p.id)}${esc(p.name)}</span>${rdy.includes(p.id)?'<span class="tag">pronto</span>':''}</li>`).join('')}</ul></div></div><div>`;
      if(!R.spy)h+=`<h3>Quadro de suspeitos</h3><p style="color:var(--mut);margin:0 0 14px">Clique em um jogador para alternar: <b style="color:var(--txt)">Na dúvida</b> → <b style="color:#ef4444">Suspeito</b> → <b style="color:#3ddc97">Inocente</b></p>
        <div class="sus">${S.players.map(p=>{const m=marks[p.id]||0;return `<div class="pc s${m}" onclick="mark(${p.id})">${av(p.id)}<div class="cn"><b>${esc(p.name)}</b>${p.id===S.you?'<small>(você)</small>':''}<small>${['Na dúvida','Suspeito','Inocente'][m]}</small></div></div>`}).join('')}</div>
        <hr style="border:0;border-top:2px solid var(--line);margin:28px 0">`;
      h+=`<h3>Possíveis localidades <small style="font-weight:400">(toque para riscar)</small></h3><div class="grid6">${R.locs.map((l,i)=>tile(l,struck.has(i)?'x':'',`onclick="strike(${i})"`)).join('')}</div></div></div>`;
    }
  }
  A.innerHTML=h;trans(S?S.phase:mode);
}
function nameVal(){const v=($('name')?$('name').value:store.get('name','')).trim();store.set('name',v);return v}
function menu(m){const n=nameVal();if(!n){err='Digite seu nome para continuar.';return render()}err='';if(m==='create')tx({type:'create',name:n,game});else{mode='join';render();const c=$('code');if(c)c.focus()}}
function join(){tx({type:'join',name:nameVal(),code:$('code').value,game})}
function strike(i){struck.has(i)?struck.delete(i):struck.add(i);render()}
render();
</script><script src="/pika-client.js"></script><script src="/perguntas-client.js"></script></body></html>

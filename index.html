<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resenha da Madrugada</title><meta name="theme-color" content="#070b17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1017'/%3E%3Ccircle cx='30' cy='34' r='18' fill='%23f5c542'/%3E%3Ccircle cx='41' cy='27' r='16' fill='%230d1017'/%3E%3Ccircle cx='48' cy='14' r='2.5' fill='%23f5c542'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b17;--n1:#0f1a3a;--n2:#16254f;--line:#2b3d7a;--acc:#ffc233;--acc2:#a87400;--ink:#0a0e1a;--txt:#eaf0ff;--mut:#8fa0cf;--disp:Bungee,Impact,"Arial Black",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
html{color-scheme:dark}
*{scrollbar-width:thin;scrollbar-color:var(--acc) #0a1230}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#0a1230;border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--acc),var(--acc2));border-radius:8px;border:3px solid #0a1230}
::-webkit-scrollbar-thumb:hover{filter:brightness(1.15)}
::-webkit-scrollbar-corner{background:#0a1230}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(900px 600px at 85% -10%,rgba(255,194,51,.22),transparent 60%),radial-gradient(800px 700px at 0% 110%,rgba(60,90,200,.35),transparent 60%),linear-gradient(#070b17,#0b1230)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 90px 120px,#fff6,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#ffd97a99,transparent),radial-gradient(1px 1px at 60px 180px,#fff5,transparent);background-size:200px 220px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.9}}
#lb{position:fixed;top:0;left:0;height:4px;width:100%;z-index:60;background:linear-gradient(90deg,transparent,var(--acc),transparent);transform:translateX(-100%);opacity:0}
body.loading #lb{opacity:1;animation:slide 1s linear infinite}@keyframes slide{to{transform:translateX(100%)}}
.rc{position:fixed;top:0;left:0;right:0;z-index:90;background:#e04848;color:#fff;text-align:center;font:700 .85rem Rubik,sans-serif;padding:8px;transform:translateY(-100%);transition:transform .25s}.rc.on{transform:none}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--acc);color:var(--ink);font:700 .9rem Rubik,sans-serif;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:95}#toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;display:inline-flex;align-items:center;padding:12px 18px;border-radius:999px;font-size:.85rem;box-shadow:0 5px 0 var(--acc2),0 8px 20px rgba(0,0,0,.4)}
.pp{position:fixed;right:16px;bottom:16px;z-index:30;width:min(280px,calc(100vw - 32px));max-height:50vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.pph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mini{padding:6px 12px;font-size:.75rem;background:var(--n2);color:var(--txt);border-color:var(--line);box-shadow:0 3px 0 #0a1230}
.ppl{overflow-y:auto;min-height:0;flex:1;padding-right:6px}.ppl li{padding:4px 0;min-width:0}.pp .av{width:34px;height:34px;flex-basis:34px;font-size:1.1rem}
.pp .nm{min-width:0;overflow:hidden}.pp .cn{flex:1;min-width:0;overflow:hidden}
.pp .cn b{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}
.pp .sb{flex-wrap:nowrap}.pp .bad{flex:none}
@media(min-width:1100px){.pp{top:84px;bottom:auto;width:260px;max-height:calc(100vh - 110px)}body.pp-open main{padding-right:292px}}
body.inroom main{padding-bottom:96px}
.bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px clamp(16px,4vw,56px);background:linear-gradient(#070b17ee,#070b1700);backdrop-filter:blur(6px)}
.bar .l{justify-self:start}.bar .r{justify-self:end}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:1rem;color:var(--acc);letter-spacing:1px;cursor:default;user-select:none}
.moon{width:26px;height:26px;border-radius:50%;background:var(--acc);box-shadow:inset -9px -2px 0 0 #0b1230,0 0 14px rgba(255,194,51,.6)}
.nbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px 10px 14px;background:var(--n2);color:var(--txt);border:2px solid var(--line);border-radius:12px;box-shadow:0 4px 0 #0a1230;font:700 .78rem Rubik,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.15s}
.nbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}.nbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1230}
.nbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.hide{visibility:hidden}
main{min-height:calc(100vh - 78px);display:flex;flex-direction:column;padding:8px clamp(16px,4vw,56px) 48px}
#app{margin:auto 0;width:100%}
#app.stack>*{max-width:820px;width:100%;margin-left:auto;margin-right:auto}#app.stack.wide>*{max-width:1280px}
#app.fw>*{max-width:1500px;width:100%;margin-left:auto;margin-right:auto}
#app>button{display:block}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.enter>*:nth-child(2){animation-delay:.07s}.enter>*:nth-child(3){animation-delay:.14s}.enter>*:nth-child(4){animation-delay:.21s}.enter>*:nth-child(n+5){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.splash{display:flex;flex-direction:column;align-items:center;gap:18px;padding:80px 0;color:var(--mut)}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--n2);border-top-color:var(--acc);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
button{font:700 1rem Rubik,sans-serif;letter-spacing:.5px;padding:13px 22px;border-radius:12px;border:2px solid #7a5200;background:var(--acc);color:var(--ink);box-shadow:0 5px 0 var(--acc2);cursor:pointer;position:relative;transition:transform .12s,box-shadow .12s,filter .12s}
button:hover{filter:brightness(1.08);transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc2)}
button.sec{background:var(--n2);color:var(--txt);border-color:var(--line);box-shadow:0 5px 0 #0a1230}
button.bad{background:#e04848;color:#fff;border-color:#8c1f1f;box-shadow:0 4px 0 #8c1f1f;padding:8px 14px;font-size:.85rem}
button.cx{background:#e04848;color:#fff;border-color:#8c1f1f;box-shadow:0 5px 0 #8c1f1f}
button:disabled{opacity:.4;pointer-events:none}button.busy{pointer-events:none;color:transparent!important}
button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;border:3px solid rgba(128,128,128,.4);border-top-color:#fff;animation:rot .7s linear infinite}
input{font:500 1rem Rubik,sans-serif;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#0a1230;color:var(--txt);width:100%}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,194,51,.18)}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:1px;margin:.2em 0}
h1{text-align:center;font-size:clamp(1.8rem,4vw,3rem);color:var(--acc);text-shadow:0 4px 0 var(--acc2)}h2{font-size:clamp(1.3rem,2.4vw,2rem)}h3{font-size:1.1rem;color:var(--acc)}
label{display:block;font:700 .72rem Rubik;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-bottom:8px}small{color:var(--mut)}
.card{position:relative;background:linear-gradient(180deg,var(--n2),var(--n1));border:2px solid var(--line);border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;top:-2px;left:22px;width:70px;height:4px;background:var(--acc);border-radius:0 0 4px 4px}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1;min-width:0}.err{color:#ff7b7b;text-align:center;font-weight:500}.ctr{text-align:center}input.ctr{text-align:center}
.hero{text-align:center;padding:20px 0 6px}.eyebrow{font:700 .78rem Rubik;letter-spacing:6px;text-transform:uppercase;color:var(--mut)}
.hero.rel{position:relative;max-width:1280px;margin-left:auto;margin-right:auto;width:100%}
.hero.rel .iw{position:absolute;top:6px;right:0;display:flex;align-items:center;gap:10px}
.ihint{font:700 .7rem Rubik;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.title{font-family:var(--disp);font-size:clamp(2.4rem,8vw,6.5rem);line-height:.95;color:var(--acc);text-shadow:0 5px 0 var(--acc2),0 0 40px rgba(255,194,51,.35);margin:10px 0 14px;transform:skew(-4deg)}
.sub{color:var(--mut);font-size:1.1rem}.mut{text-align:center;color:var(--mut)}
.beta{text-align:center;font-size:.72rem;letter-spacing:1px;color:var(--mut);opacity:.75;padding:1.6vh 0 0}
.ibtn{width:34px;height:34px;padding:0;border-radius:50%;background:var(--n2);color:var(--acc);border:2px solid var(--acc);box-shadow:0 3px 0 #0a1230;font:italic 700 1.15rem Georgia,serif;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{filter:none;transform:translateY(-2px);background:var(--acc);color:var(--ink)}.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1230}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:clamp(16px,2.5vw,32px);max-width:1280px;margin:34px auto 0}
.gc{position:relative;height:min(56vh,480px);min-height:340px;border-radius:24px;overflow:hidden;border:3px solid var(--line);cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-end;isolation:isolate}
.gc:hover{transform:translateY(-10px) rotate(-1deg);border-color:var(--acc);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 40px rgba(255,194,51,.25)}
.gc .art{position:absolute;inset:0;z-index:-2}.gc .art img{width:100%;height:100%;object-fit:cover}.gc .art img+i{display:none}
.gc .art i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:normal 400 clamp(3rem,9vw,6rem) Bungee,Impact,sans-serif;color:rgba(255,255,255,.14);transform:rotate(-8deg)}
.gc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 35%,rgba(7,11,23,.95))}
.gc .no{position:absolute;top:14px;left:18px;font-family:var(--disp);font-size:3.2rem;color:rgba(255,255,255,.2)}
.gc .ibtn{position:absolute;top:14px;right:14px;z-index:3}
.gc .info{padding:22px;width:100%;min-height:8.6rem;text-align:left}
.gc .info b{display:block;font-family:var(--disp);font-weight:400;font-size:1.45rem;line-height:1.2;min-height:2.4em;color:#fff;margin-bottom:6px}.gc .info span{display:block;color:var(--mut);font-size:.92rem}
.gc.off{filter:grayscale(.7) brightness(.7);cursor:default}.gc.off:hover{transform:none;border-color:var(--line);box-shadow:none}
.ribbon{position:absolute;top:22px;right:-38px;transform:rotate(35deg);background:var(--acc);color:var(--ink);font:700 .7rem Rubik;letter-spacing:2px;padding:5px 44px;text-transform:uppercase}
body.home{overflow:hidden;height:100vh}body.home .bar{display:none}
body.home main{height:100vh;min-height:0;padding:3vh clamp(16px,4vw,56px)}
body.home #app{margin:0;height:100%;display:flex;flex-direction:column}
body.home .hero{padding:0}body.home .title{font-size:clamp(2rem,min(7vw,11vh),5.5rem);margin:1vh 0}
body.home .games{flex:1;min-height:0;margin:3vh auto 0;width:100%}body.home .gc{height:auto;min-height:0}
@media(max-width:760px){body.home{overflow-y:auto;height:auto}body.home main,body.home #app{height:auto}body.home .gc{min-height:240px}}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,64px);align-items:center;max-width:1280px;margin:0 auto}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.art-side .title{font-size:clamp(2.2rem,6vw,5rem);transform-origin:left}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choices button{padding:16px 10px;font-size:1.05rem}
.codein{text-align:center;font-size:1.9rem;letter-spacing:10px;text-transform:uppercase;font-family:var(--disp)}
.code{font-family:var(--disp);font-size:clamp(3rem,9vw,6rem);color:var(--acc);text-align:center;letter-spacing:12px;text-shadow:0 5px 0 var(--acc2),0 0 40px rgba(255,194,51,.3)}
ul{list-style:none;padding:0;margin:0}li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:8px}li .nm{flex:1;display:flex;align-items:center;gap:10px}
.rk{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}.rk:last-child{border:0}
.rp{font:400 1.1rem Bungee,Impact,sans-serif;color:var(--acc);width:44px}.rpt{font-weight:700;white-space:nowrap}
.gn{display:inline-block;background:var(--acc);color:var(--ink);border-radius:6px;padding:2px 7px;font-size:.75rem;margin-left:6px;vertical-align:middle}.gn.neg{background:#e04848;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#0a1230;border:2px solid var(--line);border-radius:14px;padding:6px 16px 6px 6px;font-weight:700;text-align:left}
.chip.sm{padding:3px 12px 3px 3px;font-size:.85rem;gap:8px}.chip.sm .av{width:30px;height:30px;flex-basis:30px;font-size:1rem;border-radius:9px}

.av.iv{opacity:.6;outline:2px dashed var(--mut);outline-offset:1px;filter:grayscale(.35)}

.av.cv::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;border-radius:50%;background:var(--acc);color:var(--ink);font:700 .6rem Rubik,sans-serif;display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:.8rem;color:var(--mut)}.legend span{display:flex;align-items:center;gap:8px}

.vside{margin-bottom:16px}.vside .card{margin:0}
.vl{display:flex;flex-direction:column;gap:8px;margin-top:10px}.vl .chip{width:100%}
@media(min-width:1100px){
  #app>aside.vside{position:fixed;left:16px;top:96px;width:228px;max-width:228px;max-height:calc(100vh - 120px);overflow-y:auto;margin:0;z-index:15}
  body.vs-open main{padding-left:260px}
}
.tm,.tmL{font-family:var(--disp);color:var(--acc);font-size:.85rem}.tm.late,.tmL.late{color:#ff7b7b}.tmb{font-size:1.6rem;text-align:center;margin:4px 0 14px}
.emos{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}@media(max-width:560px){.emos{grid-template-columns:repeat(5,1fr)}}
.eb,.cb{padding:0;box-shadow:none;background:var(--n1);border:2px solid var(--line)}.eb:hover,.cb:hover{transform:none;filter:brightness(1.2)}.eb:active,.cb:active{transform:none;box-shadow:none}

.cols{display:flex;flex-wrap:wrap;gap:10px}.cb{width:34px;height:34px;border-radius:50%}

<header class="bar"><button class="nbtn l" id="bk" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Voltar</button>

<main><div id="app"></div></main><div id="ntc"></div><div id="cfm"></div><div id="nt"></div><div id="fx"></div><div id="toast"></div><div id="pp"></div><script>
// As capas dos jogos também podem ser alteradas pelo painel admin (/gerenciar-locais). "img" é o valor padrão.
const GAMES=[
  {id:'locais',name:'Impostor - Locais',short:'Locais',img:'',ok:true,tag:'Descubra o espião antes que ele descubra o local.'},
  {id:'pika',name:'O meu é mais Pika',short:'Pika',img:'',ok:true,tag:'Uma letra, um tema: quem disser a pior palavra perde.'},
  {id:'perguntas',name:'Impostor - Perguntas',short:'Perguntas',img:'',ok:true,tag:'Duas perguntas, um impostor.'},
  {id:'cidade',name:'Cidade Dorme',short:'Cidade',img:'',ok:true,tag:'A cidade dorme e o assassino age. Descubra quem é.'}];
const VOTEINFO=`<li><b>Quem falta votar:</b> aparece em uma lista vertical no lado esquerdo da tela, fora da área principal (em telas pequenas, acima dos cards).</li><li><b>Intenção e voto:</b> a intenção aparece com borda tracejada e esmaecida. O voto confirmado aparece com borda dourada e um ✓. No card da pessoa em quem você declarou intenção, o botão vira <b>Cancelar intenção</b> (vermelho) para desistir sem escolher outro jogador.</li><li><b>Maioria:</b> se alguém receber mais da metade dos votos (metade + 1), a votação termina na hora, mesmo que falte gente votar, e uma animação avisa que a votação foi encerrada.</li>`;
const INFO={
locais:{brief:'Todos recebem o mesmo local, menos o espião. Façam perguntas uns aos outros, descubram quem não sabe onde está e votem. O espião tenta descobrir o local sem ser pego.',
full:`<h4>Objetivo</h4><p>Todos os jogadores recebem o mesmo <b>local</b>, menos um: o <b>espião</b>, que não sabe onde está. Os jogadores tentam descobrir quem é o espião. O espião tenta descobrir o local e não ser pego.</p>
<h4>Antes de começar</h4><ul><li><b>Ícone e cor:</b> cada jogador escolhe um emoji e uma cor. Dois jogadores não podem ter o mesmo emoji, mas as cores podem se repetir.</li><li><b>Nome:</b> não pode haver dois jogadores com o mesmo nome na sala, e nomes com palavras ofensivas ou preconceituosas não são aceitos.</li><li><b>Localidades:</b> o líder (quem criou a sala) marca quais localidades entram na partida, e todos veem a seleção.</li><li><b>Convite:</b> o botão "Copiar convite" gera um link que leva os amigos direto para a entrada da sala.</li><li><b>Iniciar:</b> só o líder inicia a partida.</li></ul>
<h4>Sorteios</h4><ul><li>O <b>local</b> e <b>quem começa perguntando</b> são sorteados por ciclos: só se repetem depois que todos os outros já tiveram a sua vez.</li><li>O <b>espião</b> é sorteado com chances ajustadas pelo histórico recente da sala: quem foi espião há pouco tempo, ou várias vezes nas últimas 10 partidas, tem menos chance de ser sorteado de novo, mas qualquer um pode se repetir. O histórico vale enquanto a sala existir.</li></ul>
<h4>Durante a partida</h4><ul><li><b>Seu cartão:</b> mostra o local, ou "Espião" se você for o espião.</li><li><b>Quem começa:</b> no início de cada rodada, uma janela mostra quem faz a primeira pergunta.</li><li><b>Conversa:</b> façam perguntas uns aos outros sobre o local, sem entregar demais.</li><li><b>Anotações:</b> o botão <b>Anotar</b> (no card de cada jogador do quadro de suspeitos) e o botão <b>Anotações</b> (nos cards da votação e no card "Prontos para votar") abrem um balão só seu. Nele você escolhe um jogador (inclusive você) e anota as perguntas que ele fez (para quem fez e a resposta) e as que ele recebeu (quem perguntou e a resposta). Os campos já vêm abertos, e quando você preenche um, aparece outro em branco na próxima vez que abrir o jogador. Cada pergunta é um único registro: se você anota que X perguntou algo a Y, a mesma pergunta aparece nas anotações de Y como recebida, e a resposta anotada aparece nos dois lados. Ninguém mais vê, e as anotações são apagadas a cada rodada.</li><li><b>Quadro de suspeitos:</b> só você vê. Clique em um jogador para alternar entre Na dúvida, Suspeito e Inocente. É só uma anotação sua, e o seu próprio card não muda. O espião não tem esse quadro, mas tem uma lista de jogadores só para anotações.</li><li><b>Possíveis localidades:</b> toque em uma localidade para riscá-la e lembrar o que já descartou.</li></ul>
<h4>Votação</h4><ul><li><b>Pronto para votar:</b> quando achar que já deu, clique no botão. Se mudar de ideia, clique em Cancelar. A votação só abre quando todos estiverem prontos.</li><li><b>Declarar intenção:</b> seu emoji aparece no card da pessoa escolhida, para a turma ver em quem a maioria quer votar. Você pode mudar de alvo quantas vezes quiser.</li><li><b>Votar:</b> abre uma confirmação só para você, e o voto é definitivo. Quando a votação termina, o mais votado é revelado.</li>${VOTEINFO}</ul>
<h4>Quem vence e pontos</h4><ul><li>Se o espião for o único mais votado, <b>os jogadores vencem</b> e todos os inocentes ganham 1 ponto, mesmo quem não chegou a votar porque a votação terminou por maioria.</li><li>Se outra pessoa for a mais votada, ou houver empate, <b>o espião vence</b> e ganha 2 pontos.</li><li><b>Ranking:</b> os pontos só contam quando a partida termina, ficam guardados enquanto a sala existir e aparecem na tela final (com um selo +1 ou +2 em quem pontuou) e na sala de espera.</li></ul>
<h4>Outras regras</h4><ul><li>Se alguém sair, a partida continua. <b>Se o espião sair da sala, a rodada recomeça</b> com novo local e novo espião. Se a sua conexão cair, você tem 60 segundos para voltar sozinho à partida.</li><li>O painel <b>Jogadores</b> mostra quem está na sala. O líder o vê aberto em telas grandes e pode remover quem estiver parado, ou minimizá-lo.</li><li>Não é possível entrar em uma partida em andamento.</li><li>No fim, o líder pode clicar em <b>Jogar novamente</b> para sortear novo espião e novo local.</li></ul>`},
pika:{brief:'O líder escolhe um tema e uma letra é sorteada. Cada jogador diz uma palavra do tema que comece com a letra, e todos votam na pior resposta.',
full:`<h4>Objetivo</h4><p>Uma letra é sorteada e existe um tema. Cada jogador diz uma palavra do tema que comece com essa letra. No fim, a turma vota na <b>pior palavra</b>, e quem a escreveu perde.</p>
<h4>Sala de espera</h4><ul><li><b>Ícone e cor:</b> cada jogador escolhe um emoji (único na sala) e uma cor.</li><li><b>Nome:</b> não pode haver dois jogadores com o mesmo nome na sala, e nomes com palavras ofensivas ou preconceituosas não são aceitos.</li><li><b>Tema:</b> o líder (quem criou a sala) digita o tema ou escolhe uma <b>sugestão</b> na lista, e todos veem.</li><li><b>Letras:</b> só o líder pode excluir letras do sorteio, tocando nelas. Letras riscadas não entram.</li><li><b>Convite:</b> o botão "Copiar convite" gera um link que leva os amigos direto para a entrada da sala.</li><li><b>Iniciar:</b> só o líder inicia a partida.</li></ul>
<h4>Rodada</h4><ul><li><b>Roleta:</b> uma animação sorteia a letra entre as que não foram excluídas. Uma letra só volta a ser sorteada depois que todas as outras já saíram.</li><li><b>Tema e letra:</b> aparecem na tela, seguidos de uma contagem de 3 segundos.</li><li><b>Eu tenho!:</b> quando você pensar em uma palavra, clique no botão. Você entra na fila pela ordem dos cliques, e a fila fica visível para todos. Quem quiser pode clicar em <b>Sair da fila</b>.</li><li><b>Escrever:</b> só a pessoa que está na frente da fila escreve por vez, para ninguém repetir a mesma palavra. Quando ela envia, o nome e a palavra aparecem para todos, e o próximo da fila é liberado.</li><li><b>Tempo:</b> quando chega a sua vez, você tem 10 segundos. Depois disso aparece "Tempo esgotado", e aos 15 segundos sem enviar você vai para o fim da fila.</li><li><b>Último a escrever:</b> quando só falta uma pessoa, ela tem 20 segundos. Se não enviar a palavra, fica fora da rodada: não vota e não pontua.</li></ul>
<h4>Votação</h4><ul><li>Começa quando todos enviaram suas palavras (ou ficaram de fora), sem limite de tempo.</li><li><b>Declarar intenção:</b> seu emoji aparece no card escolhido, para a turma ver em quem a maioria quer votar.</li><li><b>Votar:</b> abre uma confirmação só para você, e o voto é definitivo. O contador de votos aparece no card assim que alguém recebe um voto.</li>${VOTEINFO}<li>Quando a votação termina, o mais votado é o perdedor, e o card da pior escolha ganha destaque. Em caso de empate, todos os empatados perdem.</li></ul>
<h4>Pontos e ranking</h4><ul><li>Quem não teve a pior escolha ganha 1 ponto, mesmo que não tenha votado porque a votação terminou por maioria. Quem ficou de fora da rodada não pontua.</li><li>Os pontos ficam guardados enquanto a sala existir e aparecem na tela final (com um selo +1 em quem pontuou) e na sala de espera.</li></ul>
<h4>Depois da rodada</h4><ul><li><b>Nova partida:</b> volta à sala de espera para trocar o tema e as letras.</li><li><b>Jogar novamente o mesmo tema:</b> sorteia uma nova letra e começa outra rodada. Os dois botões são do líder e pedem confirmação.</li><li>Se a sua conexão cair, você tem 60 segundos para voltar sozinho. O líder vê o painel <b>Jogadores</b> aberto em telas grandes e pode remover quem estiver parado.</li></ul>`},
perguntas:{brief:'Um host escreve duas perguntas parecidas: uma para os inocentes e outra para o impostor. Todos respondem, as respostas são reveladas e vocês votam em quem recebeu a pergunta diferente.',
full:`<h4>Objetivo</h4><p>O <b>host</b> escreve duas perguntas parecidas: uma para os <b>inocentes</b> e outra para o <b>impostor</b>. Todos respondem sem saber que existem duas perguntas. Os jogadores tentam descobrir quem respondeu à pergunta diferente. O impostor tenta passar despercebido.</p>
<h4>Sala de espera</h4><ul><li><b>Áreas:</b> a sala tem duas áreas, <b>Host</b> e <b>Jogadores</b>. A área Host começa vazia e comporta só uma pessoa. Para trocar o host, quem está nela clica em "Sair do host" e outra pessoa clica em "Ser o host".</li><li><b>Convite:</b> o botão "Copiar convite" gera um link que leva os amigos direto para a entrada da sala.</li><li><b>Iniciar:</b> só o líder (quem criou a sala) inicia, e apenas se houver alguém como host e ao menos um jogador.</li><li><b>Ícone e cor:</b> cada jogador escolhe um emoji (único na sala) e uma cor.</li><li><b>Nome:</b> não pode haver dois jogadores com o mesmo nome na sala, e nomes com palavras ofensivas ou preconceituosas não são aceitos.</li></ul>
<h4>Rodada</h4><ul><li><b>Host escreve:</b> os jogadores veem "Esperando o Host escrever as perguntas". O host escreve a pergunta dos inocentes e a do impostor.</li><li><b>Sorteio:</b> o impostor é sorteado entre os jogadores com chances ajustadas pelo histórico recente da sala (quem foi impostor há pouco tempo, ou várias vezes nas últimas 10 partidas, tem menos chance, mas pode se repetir). Todos os outros recebem a pergunta dos inocentes.</li><li><b>Respostas:</b> cada jogador vê só a sua pergunta, escreve a resposta e clica em Enviar.</li><li><b>Host espectador:</b> o host não joga. Ele acompanha a partida, vê quem é o impostor e as duas perguntas, e vê quem já respondeu e quem falta responder, mas não pode votar.</li></ul>
<h4>Revelação</h4><ul><li>Quando todos enviarem, as respostas aparecem embaçadas e são reveladas <b>uma por vez</b>, em ordem aleatória, com os nomes.</li><li>Só depois da última resposta a <b>pergunta dos inocentes</b> é revelada. É nesse momento que o impostor descobre que era o impostor.</li></ul>
<h4>Votação</h4><ul><li>Os inocentes veem só a pergunta dos inocentes. O impostor e o host veem as duas, e para o impostor a pergunta dele fica destacada.</li><li><b>Declarar intenção:</b> seu emoji aparece no card escolhido, para a turma ver em quem a maioria quer votar.</li><li><b>Votar:</b> abre uma confirmação só para você, e o voto é definitivo. O host não vota, mas vê quem já votou e quem falta. A maioria é calculada só entre os jogadores.</li>${VOTEINFO}</ul>
<h4>Resultado e pontos</h4><ul><li>Se o mais votado for o impostor, <b>os jogadores vencem</b> e todos os inocentes ganham 1 ponto, mesmo quem não chegou a votar porque a votação terminou por maioria.</li><li>Se não, aparece o nome do impostor e que <b>ele ganhou a partida</b>, e ele ganha 2 pontos. Empate também dá vitória ao impostor. O host não pontua.</li><li>No fim, aparecem o card de resultado, o ranking da sala (com um selo +1 ou +2 em quem pontuou) e as duas perguntas. O líder escolhe <b>Nova partida</b> (volta à sala de espera, para trocar o host) ou <b>Jogar novamente</b> (mesmo host, perguntas novas).</li><li>Os pontos ficam guardados enquanto a sala existir.</li><li>Se a sua conexão cair, você tem 60 segundos para voltar sozinho. O líder vê o painel <b>Jogadores</b> aberto em telas grandes e pode remover quem estiver parado.</li></ul>`},
cidade:{brief:'A cidade dorme e um assassino age em segredo. Todo dia a cidade debate e vota em quem acha que é o assassino. Há também um detetive e um anjo. O narrador é o servidor.',
full:`<h4>Objetivo</h4><p>A cidade dorme e um <b>assassino</b> age em segredo. Os moradores precisam descobrir quem é o assassino antes que sobrem poucos vivos. O narrador é o próprio servidor.</p>
<h4>Antes de começar</h4><ul><li>São necessários <b>5 jogadores</b> (o jogo fica melhor com 6 ou mais). Só o líder inicia.</li><li><b>Duração da noite:</b> o líder escolhe na sala de espera (10, 15, 20, 30, 45 ou 60 segundos; o padrão é 15). Todos veem o mesmo tempo.</li><li><b>Nome:</b> não pode haver dois jogadores com o mesmo nome na sala, e nomes com palavras ofensivas ou preconceituosas não são aceitos.</li><li>Os papéis são sorteados com o mesmo sistema ponderado dos outros jogos (histórico da sala), e só você vê o seu.</li></ul>
<h4>Papéis</h4><ul><li><b>Assassino:</b> há 1 por partida. A cada noite escolhe alguém para eliminar.</li><li><b>Detetive:</b> há 1 por partida. A cada noite investiga alguém e descobre, só para ele, se a pessoa é um cidadão comum ou alguém diferente (assassino ou anjo), sem saber a função. Cada pessoa só pode ser investigada uma vez.</li><li><b>Anjo:</b> há 1 por partida. A cada noite protege alguém. Pode proteger a si mesmo e pode repetir a mesma pessoa. Se o assassino escolher quem está protegido, ninguém morre.</li><li><b>Cidadãos:</b> são todos os demais jogadores. Não têm poder especial; debatem e votam.</li></ul>
<h4>Como funciona uma rodada</h4><ul><li><b>Papéis:</b> cada um vê o seu papel e clica "Entendi, pode dormir". Quando todos clicam, começa a noite.</li><li><b>Noite:</b> todos veem "A cidade dorme". Assassino, detetive e anjo vivos escolhem seus alvos: basta tocar na pessoa e clicar em <b>Confirmar escolha</b>, e a escolha é definitiva. A noite dura o tempo definido pelo líder e sempre vai até o fim, mesmo que todos já tenham agido, para ninguém deduzir quem tem poder pelo tempo. Assassino, detetive e anjo sempre agem: quem não escolher a tempo tem o alvo sorteado entre as opções válidas do seu papel (o detetive não cai em quem já investigou), e só essa pessoa sabe disso.</li><li><b>Amanhecer:</b> aparece "Cidade acorda: Ninguém morreu" ou "Cidade acorda: uma pessoa morreu" (ou "N pessoas morreram"), com o nome de quem morreu. O papel de quem morre não é revelado.</li><li><b>Histórico:</b> de dia, o detetive vê quem investigou (com o resultado), o anjo vê quem protegeu e o assassino vê quem matou ou tentou matar. Só a própria pessoa vê o seu histórico, e só o do detetive mostra resultado.</li><li><b>Dia:</b> a cidade debate (por voz ou presencialmente, o site não tem chat). Quando todos os vivos clicam em <b>Pronto para votar</b>, abre a votação.</li><li><b>Votação:</b> cada vivo declara intenção e vota. Quem tiver mais votos é eliminado. Em caso de empate, ninguém é eliminado. Quem quiser pode <b>pular a votação</b> (não votar em ninguém), e também pode declarar a intenção de pular antes de confirmar. Quem declarou intenção ou pulou aparece no card "Pular votação", do mesmo jeito que os votos aparecem nos jogadores. Se os votos para pular empatarem ou superarem o mais votado, ninguém é eliminado. Depois da votação aparece "A cidade dorme" com o resultado por 5 segundos e a noite recomeça.</li></ul>
<h4>Votação</h4><ul>${VOTEINFO}</ul>
<h4>Quem morre</h4><ul><li>Quem morre (ou é eliminado) vira espectador: continua vendo a tela e <b>vê os papéis de todos</b>. Não conte para ninguém!</li><li>Quem sair da sala é tratado como morto.</li></ul>
<h4>Como se vence e pontos</h4><ul><li><b>A cidade vence</b> quando o assassino é eliminado (ou sai da sala). Todos os que não são o assassino ganham 1 ponto, mesmo os mortos.</li><li><b>O assassino vence</b> quando sobra apenas mais uma pessoa viva além dele, e ganha 2 pontos.</li><li>No fim, o papel de todos é revelado, e o ranking da sala é atualizado.</li></ul>`}};
const EMOTES=["😎","🤠","🥸","🤓","😈","👻","🤖","👽","🦊","🐸","🐙","🦄","🐼","🦁","🐵","🐲","🐶","🐱","🦉","🐧"];

const busy=on=>document.body.classList.toggle('loading',on);
let ws,retry=0,cTimer,lastPong=0;
function connect(){
  clearTimeout(cTimer);
  if(ws&&(ws.readyState===0||ws.readyState===1))return;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{ready=true;retry=0;$('rc').classList.remove('on');
    if(store.get('inroom',false))ws.send(JSON.stringify({type:'resume',token:TOKEN}));
    render()};
  ws.onmessage=onMsg;
  ws.onclose=()=>{$('rc').classList.add('on');busy(false);cTimer=setTimeout(connect,Math.min(800*2**retry++,5000))};
  ws.onerror=()=>{};
}
function reopen(){try{ws.onclose=null;ws.close()}catch(e){}ws=null;$('rc').classList.add('on');connect()}
// "quiet" não mostra a barra de carregamento (usado em ações leves, como configurar a sala)
const tx=(o,quiet)=>{if(!ws||ws.readyState!==1){toast('Sem conexão. Reconectando…');return}ws.send(JSON.stringify(o));if(!quiet){busy(true);clearTimeout(lt);lt=setTimeout(()=>busy(false),4000)}};
function onMsg(e){busy(false);const m=JSON.parse(e.data);let closing=false;
  if(m.type==='pong'){lastPong=Date.now();return}
  if(m.type==='info'){notify(m.msg);return}
  if(m.type==='resumed'){screen='game';if(m.gid)game=m.gid;return}
  if(m.type==='resume_failed'){store.set('inroom',false);S=null;notify('A sala em que você estava não existe mais, ou o tempo para reconectar acabou.');render();return}
  if(m.type==='kicked'){store.set('inroom',false);S=null;screen='home';mode='menu';if(typeof closeConfirm==='function')closeConfirm();$('fx').innerHTML='';NT.open=false;drawNotes();notify(m.msg||'Você saiu da sala.');render();return}
  if(m.type==='error'){if(m.alert)notify(m.msg);else err=m.msg}
  else{if(m.gid)game=m.gid;
    closing=!!S&&S.phase==='vote'&&(m.phase==='end'||(m.game==='cidade'&&(m.phase==='night'||m.phase==='sleep')));
    if(typeof closeConfirm==='function'&&(!S||S.phase!==m.phase||(P.confirm&&P.confirm.msg&&P.confirm.msg.type==='vote'&&m.voted&&m.voted.includes(m.you))))closeConfirm();
    if(S&&m.phase==='play'&&(S.phase!=='play'||(m.round&&S.round!==m.round))){struck=new Set();marks={};notes=[];saveNotes()}
    S=m;err='';invCode='';if(screen==='game'||S)store.set('inroom',true)}
  render();
  if(closing)closingFx(m);
  if(S&&!S.game&&S.phase==='play'&&S.round&&store.get('stKey','')!==S.code+':'+S.round){store.set('stKey',S.code+':'+S.round);showStarter()}}

  saveNotes()}

function rankCard(){if(!S||!S.rank||!S.rank.length)return '';let pos=0,last=null;const g=(S.phase==='end'&&S.gain)?S.gain:{};

// Sair da sala
function askLeave(fn){window._lv=fn;
  $('ntc').innerHTML=`<div class="modal"><div class="box"><h3 style="margin:0 0 10px">Sair da sala?</h3><p style="margin:0 0 18px;color:#cfd8f5">${S&&S.phase!=='lobby'?'A partida continua sem você e você não poderá voltar a ela.':'Você deixará a sala de espera.'}</p><div class="row"><button class="cx" onclick="closeNote()">Ficar</button><button onclick="doLeave()">Sair</button></div></div></div>`}
function doLeave(){const f=window._lv;closeNote();if(f)f()}
function leaveRoom(){if(S){tx({type:'leave'});S=null}store.set('inroom',false);err='';notes=[];saveNotes();NT.open=false;drawNotes();$('fx').innerHTML='';if(typeof closeConfirm==='function')closeConfirm()}
function goHome(){if(S)return askLeave(()=>{leaveRoom();screen='home';mode='menu';render()});screen='home';mode='menu';invCode='';err='';render()}
function back(){if(S)return askLeave(()=>{leaveRoom();mode='menu';err='';render()});if(mode==='join')mode='menu';else screen='home';err='';invCode='';render()}

// Painel de jogadores: reserva uma faixa à direita (telas grandes) para não encostar no conteúdo
const ppIsOpen=()=>ppOpen===null?(!!S&&S.you===S.host&&window.matchMedia('(min-width:1360px)').matches):ppOpen;
function togPanel(){ppOpen=!ppIsOpen();drawPanel()}
function drawPanel(){const el=$('pp');if(!el)return;
  const show=!!S&&screen!=='home',open=show&&ppIsOpen();
  document.body.classList.toggle('pp-open',open);
  if(!show){el.innerHTML='';return}
  const lead=S.you===S.host;
  el.innerHTML=open?`<div class="pp"><div class="pph"><b>Jogadores (${S.players.length})</b><button class="mini" onclick="togPanel()">Minimizar</button></div>
    <ul class="ppl">${S.players.map(p=>`<li><span class="nm">${av(p.id)}<span class="cn"><b title="${esc(p.name)}">${esc(p.name)}</b>${tags(p)}</span></span>${lead&&p.id!==S.you?`<button class="bad" onclick="askKick(${p.id})">Remover</button>`:''}</li>`).join('')}</ul>
    <div style="text-align:center">${inviteBtn()}</div></div>`
   :`<button class="fab" onclick="togPanel()">Jogadores (${S.players.length})</button>`}
function askKick(id){const p=pl(id);
  $('ntc').innerHTML=`<div class="modal"><div class="box"><h3 style="margin:0 0 10px">Remover jogador?</h3><p style="margin:0 0 18px;color:#cfd8f5">${esc(p.name||'?')} será removido(a) da sala.</p><div class="row"><button class="cx" onclick="closeNote()">Cancelar</button><button onclick="doKick(${id})">Remover</button></div></div></div>`}
function doKick(id){tx({type:'kick',target:id});closeNote()}

function pick(id){game=id;screen='game';mode='menu';err='';render()}
const tags=p=>(p.id===S.host||p.id===S.you||p.away)?`<span class="sb">${p.id===S.host?'<span class="tag">líder</span>':''}${p.id===S.you?'<small>(você)</small>':''}${p.away?'<span class="tag off2">offline</span>':''}</span>`:'';
const players=()=>`<div class="chips">${S.players.map(p=>`<span class="chip">${av(p.id)}<span class="cn"><b>${esc(p.name)}</b>${tags(p)}</span></span>`).join('')}</div>`;
function profileCard(){const me=pl(S.you),taken=new Set(S.players.filter(p=>p.id!==S.you).map(p=>p.emo));
  return `<div class="card"><label>Seu ícone</label><div class="emos">${EMOTES.map((e,i)=>`<button class="eb ${me.emo===i?'sel':''}" ${taken.has(i)?'disabled':''} onclick="prof(${i},${me.color})">${e}</button>`).join('')}</div>
  <label style="margin-top:16px">Sua cor</label><div class="cols">${HUES.map((h,i)=>`<button class="cb ${me.color===i?'sel':''}" style="background:hsl(${h} 55% 40%)" onclick="prof(${me.emo},${i})"></button>`).join('')}</div></div>`}

const WL={l:null,
  async on(){try{if(!('wakeLock' in navigator)||WL.l||document.hidden)return;WL.l=await navigator.wakeLock.request('screen');WL.l.addEventListener('release',()=>{WL.l=null})}catch(e){WL.l=null}},
  off(){try{if(WL.l)WL.l.release()}catch(e){}WL.l=null}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&screen!=='home')WL.on()});
let rDefer=0,rTimer;
function render(){
  const a=document.activeElement;
  if(a&&a.id==='vsel'&&rDefer<6){rDefer++;clearTimeout(rTimer);rTimer=setTimeout(render,500);return}
  rDefer=0;
  const y=window.scrollY,k0=lastKey,pk=document.querySelector('.pick');let pt=pk?pk.scrollTop:0;if(window._pickReset){pt=0;window._pickReset=0}
  try{renderMain()}catch(e){console.error(e);notify('Erro ao montar a tela: '+e.message+' ['+String(e.stack||'').split('\n')[1]+']')}
  document.body.classList.toggle('vs-open',!!document.querySelector('.vside'));
  if(S&&screen!=='home')WL.on();else WL.off();
  if(lastKey===k0&&Math.abs(window.scrollY-y)>2)window.scrollTo(0,y);
  const pk2=document.querySelector('.pick');if(pk2&&lastKey===k0)pk2.scrollTop=pt;
}
function renderMain(){
  const G=GAMES.find(g=>g.id===game),A=$('app');
  const E=err?`<p class="err">${esc(err)}</p>`:'';let h='';
  const inr=!!S&&screen!=='home';
  drawPanel();document.body.classList.toggle('inroom',inr);
  document.body.classList.toggle('home',screen==='home');
  $('bk').classList.toggle('hide',screen==='home');$('hm').classList.toggle('hide',screen==='home');$('lg').style.visibility=screen==='home'?'hidden':'visible';
  A.classList.toggle('stack',!!(S&&S.game));A.classList.toggle('fw',!!(S&&!S.game&&S.phase!=='lobby'));
  if(!ready){A.innerHTML='<div class="splash"><div class="spin"></div><p>Conectando ao servidor…</p></div>';return}
  if(screen==='home'){
    h=`<div class="hero"><div class="eyebrow">Bem-vindo à</div><div class="title">Resenha<br>da Madrugada</div><p class="sub">Escolha um jogo e marcha!</p></div>${E}
    <div class="games">${GAMES.map((g,i)=>{const im=COVERS[g.id]||g.img;return `<div class="gc ${g.ok?'':'off'}" ${g.ok?`onclick="pick('${g.id}')"`:''}><div class="art" style="${bg(g.name)}">${im?`<img src="${esc(im)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<i>${g.short}</i></div><span class="no">0${i+1}</span><button class="ibtn" title="Sobre o jogo" onclick="event.stopPropagation();showInfo('${g.id}',false)">i</button>${g.ok?'':'<span class="ribbon">Em breve</span>'}<div class="info"><b>${g.name}</b><span>${g.tag}</span></div></div>`}).join('')}</div>
    <div class="beta">Versão de testes: pode conter falhas.</div>`;
    A.innerHTML=h;trans('home');return;
  }
  if(S&&S.game==='pika'){pikaRender('');return}
  if(S&&S.game==='perguntas'){perguntasRender();return}
  if(S&&S.game==='cidade'){cidadeRender();return}
  if(!S){
    h=`<div class="split"><div class="art-side"><div class="eyebrow">Resenha da Madrugada</div><div class="title">${G.name}</div><p class="sub">${G.tag}</p></div>`;
    if(mode==='menu')h+=`<div class="card ctr"><label>Seu nome</label><input id="name" class="ctr" maxlength="30" placeholder="Como você quer ser chamado?" value="${esc(store.get('name',''))}" onkeydown="if(event.key==='Enter')menu('create')">${E}
      <div class="choices"><button onclick="menu('create')">Criar sala</button><button class="sec" onclick="menu('join')">Entrar em sala</button></div></div></div>`;
    else h+=`<div class="card ctr"><label>Seu nome</label><input id="name" class="ctr" maxlength="30" placeholder="Como você quer ser chamado?" value="${esc(store.get('name',''))}" style="margin-bottom:16px">
      <label>Código da sala</label><input id="code" class="codein" maxlength="4" placeholder="ABCD" value="${esc(invCode)}" onkeydown="if(event.key==='Enter')join()">${E}
      <div class="row"><button onclick="join()">Entrar</button></div></div></div>`;
  }else if(S.phase==='lobby'){
    const host=S.you===S.host,sel=new Set(S.selected),lbs=LBL.all();if(LBL.f&&!lbs.includes(LBL.f))LBL.f='';
    h=`${E}<div class="hero rel" style="padding:0 0 10px"><div class="eyebrow">Sala de espera</div><h1>${G.name}</h1>${infoBtn(game)}</div>
    <div class="split" style="align-items:start"><div><div class="card ctr"><label>Código da sala</label><div class="code">${S.code}</div><p class="mut">Compartilhe o código com os amigos</p>${inviteBtn()}${players()}</div>${rankCard()}${profileCard()}
    ${host?'<button style="width:100%;padding:18px;font-size:1.1rem" onclick="start()">Iniciar partida</button>':'<div class="card ctr"><div class="spin" style="margin:0 auto 14px"></div><p class="mut" style="margin:0">Aguardando o líder iniciar…</p></div>'}</div>
        <div><div class="card"><label>Localidades da partida (${sel.size} de ${S.all.length})</label>
    ${lbs.length?`<div class="lbls"><button class="lb ${LBL.f?'':'sel'}" onclick="LBL.set(-1)">Todas</button>${lbs.map((b,i)=>`<button class="lb ${LBL.f===b?'sel':''}" onclick="LBL.set(${i})">${esc(b)} (${S.all.filter(l=>(l.labels||[]).includes(b)).length})</button>`).join('')}</div>`:''}
    ${host?`<div class="row"><button class="sec" onclick="selAll(true)">${LBL.f?'Marcar estas':'Marcar todas'}</button><button class="sec" onclick="selAll(false)">${LBL.f?'Desmarcar estas':'Desmarcar todas'}</button></div>${LBL.f?`<button style="width:100%;margin:0 0 12px" onclick="LBL.only()">Jogar só com “${esc(LBL.f)}”</button>`:''}`:'<p style="color:var(--mut);font-size:.85rem;margin:0 0 12px">Só o líder escolhe as localidades.</p>'}
    <div class="pick">${S.all.map((l,i)=>LBL.has(l)?tile(l,sel.has(l.name)?'on':'off',host?`onclick="togLoc(${i})" style="cursor:pointer"`:''):'').join('')}</div></div></div></div>`;
  }else{
    const R=S.role,me=pl(S.you),host=S.you===S.host;
    h=`<div class="top"><h1>Partida em andamento</h1><div class="me">${av(S.you)}<div><b>${esc(me.name)}</b><small>Sala ${S.code}</small></div></div></div>${E}`;
    if(S.phase==='vote'||S.phase==='end'){
      if(S.phase==='end'){const r=S.result;
        h+=`<div class="card ctr resultcard ${r.caught?'win':'lose'}"><label>Resultado da partida</label><div class="rtitle">${r.caught?'Os jogadores venceram!':'O espião venceu!'}</div><p>Mais votado: <b>${r.top.map(esc).join(' e ')}</b> (${r.max} voto${r.max>1?'s':''}). O espião era <b>${esc(r.spy)}</b>.</p><p>Local: <b>${lname(r.loc.name)}</b></p>${r.early?'<p class="mut">Votação encerrada por maioria.</p>':''}
        ${host?'<button onclick="again()">Jogar novamente</button>':'<p class="mut">Aguardando o líder…</p>'}</div>${rankCard()}`;
      }else h+=`<div class="card ctr"><label>Votação</label><h2>Quem é o espião?</h2><p class="mut" style="margin:0">Declare sua intenção para a turma ver e depois vote.${S.voted.includes(S.you)?' Você já votou.':''}</p></div>`;
      h+=board(S,S.players.map(p=>({id:p.id,name:p.name})),S.phase==='end',{note:true});
    }else{
      const L=R.loc,rdy=S.ready,mine=rdy.includes(S.you);
      const card=R.spy?`<div class="loc" style="background:linear-gradient(135deg,#4a1616,#12151c)">${pic({img:R.spyImg})}<div class="ov"><small>Sua função</small><h2>Espião</h2><p>Descubra o local sem ser pego.</p></div></div>`
        :`<div class="loc" style="${bg(L.name)}">${pic(L)}<div class="ov"><small>Local</small><h2>${lname(L.name)}</h2><p>Lembre-se: não revele o local! Pergunte e responda com cuidado.</p></div></div>`;
      h+=`<div class="game"><div><h3>Seu cartão</h3>${card}
        <div class="card"><label>Prontos para votar</label><b style="font-family:var(--disp);font-size:1.5rem;color:var(--acc)">${rdy.length}/${S.players.length}</b>
        <button style="width:100%;margin:12px 0 10px" class="${mine?'cx':''}" onclick="setReady(${!mine})">${mine?'Cancelar':'Pronto para votar'}</button>
        <button class="sec" style="width:100%;margin-bottom:12px" onclick="openNotes()">Anotações</button>
        <small style="display:block;margin-bottom:8px">Começou perguntando: <b style="color:var(--txt)">${nm(S.starter)}</b></small>
        <ul class="rl">${S.players.map(p=>`<li><span class="nm">${av(p.id)}${esc(p.name)}${p.away?'<span class="tag off2">offline</span>':''}</span>${rdy.includes(p.id)?'<span class="tag">pronto</span>':''}</li>`).join('')}</ul></div></div><div>`;
      if(!R.spy)h+=`<h3>Quadro de suspeitos</h3><p style="color:var(--mut);margin:0 0 14px">Clique em um jogador para alternar: <b style="color:var(--txt)">Na dúvida</b> → <b style="color:#ef4444">Suspeito</b> → <b style="color:#3ddc97">Inocente</b></p>
        <div class="sus">${S.players.map(p=>{const self=p.id===S.you,m=marks[p.id]||0;return self?`<div class="pc self">${av(p.id)}<div class="cn"><b>${esc(p.name)}</b><small>(você)</small></div><button class="nb ${hasNotes(p.id)?'on':''}" onclick="openNotes(${p.id})">Anotar</button></div>`:`<div class="pc s${m}" onclick="mark(${p.id})">${av(p.id)}<div class="cn"><b>${esc(p.name)}</b><small>${['Na dúvida','Suspeito','Inocente'][m]}</small></div><button class="nb ${hasNotes(p.id)?'on':''}" onclick="event.stopPropagation();openNotes(${p.id})">Anotar</button></div>`}).join('')}</div>
        <hr style="border:0;border-top:2px solid var(--line);margin:28px 0">`;
      else h+=`<h3>Anotações</h3><p style="color:var(--mut);margin:0 0 14px">Toque em um jogador para anotar as perguntas e respostas dele. Só você vê.</p><div class="sus">${S.players.map(p=>`<div class="pc" onclick="openNotes(${p.id})">${av(p.id)}<div class="cn"><b>${esc(p.name)}</b>${p.id===S.you?'<small>(você)</small>':''}</div><button class="nb ${hasNotes(p.id)?'on':''}" onclick="event.stopPropagation();openNotes(${p.id})">Anotar</button></div>`).join('')}</div><hr style="border:0;border-top:2px solid var(--line);margin:28px 0">`;
      h+=`<h3>Possíveis localidades <small style="font-weight:400">(toque para riscar)</small></h3><div class="grid6">${R.locs.map((l,i)=>tile(l,struck.has(i)?'x':'',`onclick="strike(${i})"`)).join('')}</div></div></div>`;
    }
  }
  A.innerHTML=h;trans(S?S.phase:mode);
}
function nameVal(){const v=($('name')?$('name').value:store.get('name','')).trim();store.set('name',v);return v}
function menu(m){
  if(m==='join'){nameVal();mode='join';err='';render();const f=store.get('name','')?$('code'):$('name');if(f)f.focus();return}
  const n=nameVal();if(!n){err='Digite seu nome para continuar.';return render()}err='';tx({type:'create',name:n,game,token:TOKEN})}
function join(){const n=nameVal();invCode=$('code').value;if(!n){err='Digite seu nome para continuar.';return render()}err='';tx({type:'join',name:n,code:invCode,game,token:TOKEN})}
function strike(i){struck.has(i)?struck.delete(i):struck.add(i);render()}
render();connect();
</script><script src="/pika-client.js"></script><script src="/perguntas-client.js"></script><script src="/cidade-client.js"></script></body></html>
